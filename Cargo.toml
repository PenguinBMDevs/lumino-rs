[workspace]
members = ["crates/core", "crates/dms", "crates/export", "crates/gfx", "crates/midi", "crates/ui", "crates/collaboration"]
resolver = "3"

[workspace.package]
version = "0.1.0"
rust-version = "1.92.0"
homepage = "https://github.com/BuickMeow/lumino-rust"
repository = "https://github.com/BuickMeow/lumino-rust"
license = "Mulan PSL v2"
edition = "2024"

[workspace.dependencies]
lumino-core = { path = "crates/core" }
lumino-dms = { path = "crates/dms" }
lumino-export = { path = "crates/export" }
lumino-gfx = { path = "crates/gfx" }
lumino-midi = { path = "crates/midi" }
midly = { git = "https://github.com/Enderman-bm/midly-fork", rev = "92c99252a173bbd8f3685b9d26039bc2ad1854ac", features = ["std", "alloc", "parallel", "memmap"] }
lumino-ui = { path = "crates/ui" }
lumino-collaboration = { path = "crates/collaboration" }
# crates.io
iced_renderer = { version = "0.14.0", features = ["wgpu", "tiny-skia", "x11", "wayland"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"]}
thiserror = "2.0.17"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
bincode = "1.3.3"
rgb = "0.8.0"
rfd = "0.15"
tokio = { version = "1.42", features = ["full"] }
anyhow = "1.0"
winit = "0.30"

[package]
name = "lumino-rs"
version.workspace = true
rust-version.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
lumino-core = { workspace = true }
lumino-dms = { workspace = true }
lumino-export = { workspace = true }
lumino-gfx = { workspace = true }
lumino-midi = { workspace = true }
lumino-ui = { workspace = true }
lumino-collaboration = { workspace = true }
# crates.io
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4.4", features = ["derive"] }
# Private dependencies
winit = "0.30"
futures = "0.3.31"
directories = "6.0.0"
toml = "0.9.11"
bytemuck = "1.0"
rfd = "0.15"
midly = { workspace = true }
tokio = { workspace = true }
zstd = "0.13.2"
rgb = { workspace = true }
iced_core = "0.14.0"
iced = { version = "0.14.0", features = ["wgpu", "canvas"] }
puffin = "0.19.1"
puffin_http = "0.16.1"
anyhow = "1.0"
parking_lot = "0.12"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser", "windef", "minwindef"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.17.1"

[package.metadata.deb]
# maintainer = "Lumino Team"
copyright = "2025, Lumino Team"
license-file = ["LICENSE", "0"]
extended-description = "A fast Black MIDI editor built in Rust."
section = "sound"
priority = "optional"
assets = [
    ["target/release/lumino-rs", "usr/bin/lumino-rs", "755"],
    ["resources/icons/**/*", "usr/share/lumino-rs/resources/icons/", "644"],
]

[package.metadata.generate-rpm]
summary = "Lumino - A Fast Black MIDI Editor"
group = "Applications/Sound"
assets = [
    { source = "target/release/lumino-rs", dest = "/usr/bin/lumino-rs", mode = "0755" },
    { source = "resources/icons/**/*", dest = "/usr/share/lumino-rs/resources/icons/", mode = "0644" },
]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
iced_renderer = { version = "0.14.0", features = ["wgpu", "tiny-skia", "x11", "wayland"] }
iced_wgpu = { version = "0.14.0" }
iced_winit = "0.14.0"
iced_widget = { version = "0.14.0" }
iced_core = "0.14.0"
iced = { version = "0.14.0", features = ["image"] }
wgpu = "27.0"
chrono = "0.4"
tokio-test = "0.4"

[target.'cfg(windows)'.dev-dependencies]
winapi = { version = "0.3", features = ["processthreadsapi", "psapi"] }

# ── xsynth（Git 版本，subdir 仅在 patch 中受支持）──
[patch.crates-io]
xsynth-core = { git = "https://github.com/buickmeow/xsynth" }
xsynth-realtime = { git = "https://github.com/buickmeow/xsynth" }
xsynth-soundfonts = { git = "https://github.com/buickmeow/xsynth" }

[[test]]
name = "collaboration_full_test"
path = "tests/collaboration_full_test.rs"

[[test]]
name = "collaboration_ui_test"
path = "tests/collaboration_ui_test.rs"

