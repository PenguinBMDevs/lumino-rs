[workspace]
members = ["crates/core", "crates/dms", "crates/export", "crates/gfx", "crates/midi", "crates/ui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
rust-version = "1.92.0"
homepage = "https://github.com/BuickMeow/lumino-rust"
repository = "https://github.com/BuickMeow/lumino-rust"
license = "Mulan PSL v2"
edition = "2024"

[workspace.dependencies]
lumino-core = { path = "crates/core" }
lumino-dms = { path = "crates/dms" }
lumino-export = { path = "crates/export" }
lumino-gfx = { path = "crates/gfx" }
lumino-midi = { path = "crates/midi" }
midly = { git = "https://github.com/Enderman-bm/midly-fork", rev = "92c99252a173bbd8f3685b9d26039bc2ad1854ac" }
lumino-ui = { path = "crates/ui" }
# crates.io
iced_renderer = { version = "0.14.0", features = ["wgpu", "tiny-skia"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"]}
thiserror = "2.0.17"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
bincode = "1.3.3"
rgb = "0.8.0"

[package]
name = "lumino-rs"
version.workspace = true
rust-version.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
lumino-core = { workspace = true }
lumino-dms = { workspace = true }
lumino-export = { workspace = true }
lumino-gfx = { workspace = true }
lumino-midi = { workspace = true }
lumino-ui = { workspace = true }
# crates.io
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Private dependencies
winit = "0.30"
futures = "0.3.31"
directories = "6.0.0"
toml = "0.9.11"
bytemuck = "1.0"
rfd = "0.15"
midly = { workspace = true }
tokio = { version = "1.42", features = ["full"] }
zstd = "0.13.2"
rgb = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.17.1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
iced_renderer = { version = "0.14.0", features = ["wgpu", "tiny-skia"] }
iced_wgpu = { version = "0.14.0" }
iced_winit = "0.14.0"
iced_widget = { version = "0.14.0" }
iced_core = "0.14.0"
iced = { version = "0.14.0", features = ["image"] }
wgpu = "27.0"

[target.'cfg(windows)'.dev-dependencies]
winapi = { version = "0.3", features = ["processthreadsapi", "psapi"] }
