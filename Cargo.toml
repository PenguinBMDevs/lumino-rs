[workspace]
members = [
    "crates/gfx_wgpu"
]
resolver = "3"

[workspace.package]
version = "0.1.0"
rust-version = "1.92.0"
homepage = "https://github.com/BuickMeow/lumino-rust"
license = "Mulan PSL v2"
edition = "2024"

[package]
name = "lumino-rs"
version.workspace = true
rust-version.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[workspace.dependencies]
iced = { version = "0.14.0", features = ["svg"] }
iced_aw = { version = "0.13.0", features = ["menu", "quad"] }
iced_font_awesome = { version = "0.4.1", features = ["v6"] }
tracing = "0.1.43"

[dependencies]
iced = { workspace = true }
iced_aw = { workspace = true }
iced_font_awesome = { workspace = true }
tracing = { workspace = true }

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.
