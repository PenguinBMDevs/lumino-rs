[workspace]
members = ["crates/core", "crates/dialog", "crates/event", "crates/export", "crates/gfx", "crates/midi-io", "crates/midi-loader", "crates/memory-monitor", "crates/midi-model", "crates/message", "crates/onion-skin", "crates/onion-skin-hires", "crates/playback", "crates/realtime", "crates/ui", "crates/collaboration"]
resolver = "3"

[workspace.package]
version = "0.1.1"
rust-version = "1.92.0"
homepage = "https://github.com/PenguinBMDevs/lumino-rs"
repository = "https://github.com/PenguinBMDevs/lumino-rs"
license = "AGPL-3.0-or-later"
edition = "2024"

[workspace.dependencies]
lumino-core = { path = "crates/core" }
lumino-event = { path = "crates/event" }
lumino-export = { path = "crates/export" }
lumino-gfx = { path = "crates/gfx" }
lumino-midi-io = { path = "crates/midi-io" }
lumino-midi-loader = { path = "crates/midi-loader" }
lumino-onion-skin = { path = "crates/onion-skin" }
lumino-memory-monitor = { path = "crates/memory-monitor" }
lumino-midi-model = { path = "crates/midi-model" }
lumino-message = { path = "crates/message" }
lumino-playback = { path = "crates/playback" }
lumino-realtime = { path = "crates/realtime" }
midly = { version = "0.6", features = ["std", "alloc", "parallel", "memmap"] }
lumino-dialog = { path = "crates/dialog" }
lumino-ui = { path = "crates/ui" }
lumino-collaboration = { path = "crates/collaboration" }
# crates.io
iced_renderer = { version = "0.14.0", features = ["wgpu", "tiny-skia", "x11", "wayland"] }
iced_core = "0.14.0"
iced = { version = "0.14.0", features = ["wgpu", "canvas"] }
iced_wgpu = "0.14.0"
iced_winit = "0.14.0"
iced_widget = "0.14.0"
wgpu = "27.0"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
thiserror = "2.0.17"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
bincode = "1.3.3"
rgb = "0.8.0"
rfd = "0.15"
tokio = { version = "1.42", features = ["full"] }
anyhow = "1.0"
winit = "0.30"
clap = { version = "4.4", features = ["derive"] }
futures = "0.3.31"
directories = "6.0.0"
toml = "0.9.11"
bytemuck = "1.0"
puffin_http = "0.16.1"
chrono = "0.4"
tokio-test = "0.4"
raw-window-handle = "0.6"
winapi = { version = "0.3", features = ["winuser", "windef", "minwindef", "processthreadsapi", "psapi"] }
muda = "0.17.1"
# xsynth deps
xsynth-core = "0.4.0"
xsynth-soundfonts = "0.4.0"
xsynth-realtime = "0.4.0"
# duplicated dependencies — unified to workspace
zstd = "0.13.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
encoding_rs = "0.8"
num-bigint = "0.4"
puffin = "0.19.1"
parking_lot = "0.12"
hound = "3.5"
flac-encoder = "0.1"

[package]
name = "lumino-rs"
version.workspace = true
rust-version.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
lumino-core = { workspace = true }
lumino-event = { workspace = true }
lumino-export = { workspace = true }
lumino-gfx = { workspace = true }
lumino-midi-io = { workspace = true }
lumino-midi-loader = { workspace = true }
lumino-memory-monitor = { workspace = true }
lumino-ui = { workspace = true }
lumino-collaboration = { workspace = true }
lumino-dialog = { workspace = true }
# crates.io
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
winit = { workspace = true }
futures = { workspace = true }
directories = { workspace = true }
toml = { workspace = true }
bytemuck = { workspace = true }
rfd = { workspace = true }
midly = { workspace = true }
tokio = { workspace = true }
zstd = { workspace = true }
rgb = { workspace = true }
iced_core = { workspace = true }
iced = { workspace = true }
puffin = { workspace = true }
puffin_http = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { workspace = true }
raw-window-handle = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { workspace = true }

[package.metadata.deb]
# maintainer = "PenguinBMDevs"
copyright = "2025-2026, PenguinBMDevs"
license-file = ["LICENSE", "0"]
extended-description = "A fast Black MIDI editor built in Rust."
section = "sound"
priority = "optional"
assets = [
    ["target/release/lumino-rs", "usr/bin/lumino-rs", "755"],
    ["resources/icons/**/*", "usr/share/lumino-rs/resources/icons/", "644"],
]

[package.metadata.generate-rpm]
summary = "Lumino - A Fast Black MIDI Editor"
group = "Applications/Sound"
assets = [
    { source = "target/release/lumino-rs", dest = "/usr/bin/lumino-rs", mode = "0755" },
    { source = "resources/icons/**/*", dest = "/usr/share/lumino-rs/resources/icons/", mode = "0644" },
]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
iced_renderer = { workspace = true }
iced_wgpu = { workspace = true }
iced_winit = { workspace = true }
iced_widget = { workspace = true }
iced_core = { workspace = true }
iced = { version = "0.14.0", features = ["image"] }
wgpu = { workspace = true }
chrono = { workspace = true }
tokio-test = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
winapi = { workspace = true }

[patch.crates-io]
midly = { git = "https://github.com/PenguinBMDevs/midly-fork" }

[[test]]
name = "collaboration_full_test"
path = "tests/collaboration_full_test.rs"

[[test]]
name = "collaboration_ui_test"
path = "tests/collaboration_ui_test.rs"

[profile.fast-release]
inherits = "release"                # 基于 release 默认设置
opt-level = 1                       # 基本优化，编译速度远快于 3
lto = false                         # 禁用链接时优化（大幅减少链接时间）
codegen-units = 16                  # 增加并行代码生成单元（最大 16，加速编译）
debug = 1                           # 行号表（函数名+行号），支持 backtrace 和 profiler
strip = "none"                      # 保留符号用于调试分析（体积换调试能力）
panic = "abort"                    # 使用 abort 而非 unwind（减少生成的代码量）
incremental = true                 # 启用增量编译（对多次构建友好）

[workspace.lints.clippy]
mod_module_files = "deny"  # AGENTS.md：禁止 mod.rs，使用 Rust 2018 模块命名
unwrap_used = "deny"       # AGENTS.md 红线：NEVER use unwrap()
