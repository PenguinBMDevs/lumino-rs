[workspace]
# 成员按功能域分组：crates/core(基础/基础设施) / crates/audio(MIDI·音频·播放) / crates/editor(UI·渲染·编辑) / crates/network(协作·云) / crates/tools(工具·导出)
members = [
    # core — 基础数据与基础设施
    "crates/core/core", "crates/core/diagnostics", "crates/core/message", "crates/core/project",
    # audio — MIDI / 音频 / 播放
    "crates/audio/midi-io", "crates/audio/midi-loader", "crates/audio/midi-model", "crates/audio/midiplayer", "crates/audio/note-core",
    # editor — UI / 渲染 / 编辑
    "crates/editor/dialog", "crates/editor/editor-state", "crates/editor/gfx", "crates/editor/ui", "crates/editor/ui-core", "crates/editor/ui-editor", "crates/editor/ui-settings",
    # network — 协作 / 云
    "crates/network/cloud", "crates/network/collaboration",
    # tools — 工具 / 导出
    "crates/tools/export", "crates/tools/extras",
]
resolver = "3"

# xsynth 系列使用 GitHub fork（PenguinBMDevs/xsynth-Lumino，LGPL-3.0）：
# - 许可边界：LGPL 代码独立存放于 fork 仓库，不混入本仓库（AGPL-3.0）
# - fork 含定制修改：音频设备拔出/更换后，在 stream owner 线程内原地重定向 cpal 流（合成管线不动）
# - ⚠️ 必须三包一起 patch：fork 的 realtime/soundfonts 通过 workspace path 依赖 fork 内 core，
#   若只 patch 单个包，会产生 crates.io 与 git 双实例类型分裂（E0308）
[patch.crates-io]
xsynth-core = { git = "https://github.com/PenguinBMDevs/xsynth-Lumino" }
xsynth-realtime = { git = "https://github.com/PenguinBMDevs/xsynth-Lumino" }
xsynth-soundfonts = { git = "https://github.com/PenguinBMDevs/xsynth-Lumino" }

[workspace.package]
version = "0.2.1"
rust-version = "1.92.0"
homepage = "https://github.com/PenguinBMDevs/lumino-rs"
repository = "https://github.com/PenguinBMDevs/lumino-rs"
license = "AGPL-3.0-or-later"
description = "Lumino - A Fast Black MIDI Editor"
edition = "2024"

[workspace.dependencies]
lumino-core = { path = "crates/core/core", version = "0.2.1-crates-io-preview1" }
lumino-export = { path = "crates/tools/export", version = "0.2.1-crates-io-preview1" }
lumino-gfx = { path = "crates/editor/gfx", version = "0.2.1-crates-io-preview1" }
lumino-midi-io = { path = "crates/audio/midi-io", version = "0.2.1-crates-io-preview1" }
lumino-midi-loader = { path = "crates/audio/midi-loader", version = "0.2.1-crates-io-preview1" }
lumino-midiplayer = { path = "crates/audio/midiplayer", version = "0.2.1-crates-io-preview1" }
lumino-diagnostics = { path = "crates/core/diagnostics", version = "0.2.1-crates-io-preview1" }
lumino-midi-model = { path = "crates/audio/midi-model", version = "0.2.1-crates-io-preview1" }
lumino-message = { path = "crates/core/message", version = "0.2.1-crates-io-preview1" }
midly = { version = "0.6.3", package = "lumino-midly", features = ["std", "alloc", "parallel", "memmap"] }
lumino-dialog = { path = "crates/editor/dialog", version = "0.2.1-crates-io-preview1" }
lumino-ui = { path = "crates/editor/ui", version = "0.2.1-crates-io-preview1" }
# lumino-ui-constants: merged into lumino-ui-core::constants
# lumino-ui-host: merged into lumino-gfx::cache
lumino-ui-core = { path = "crates/editor/ui-core", version = "0.2.1-crates-io-preview1" }
lumino-ui-settings = { path = "crates/editor/ui-settings", version = "0.2.1-crates-io-preview1" }
lumino-ui-editor = { path = "crates/editor/ui-editor", version = "0.2.1-crates-io-preview1" }
lumino-collaboration = { path = "crates/network/collaboration", version = "0.2.1-crates-io-preview1" }
lumino-note-core = { path = "crates/audio/note-core", version = "0.2.1-crates-io-preview1" }
lumino-editor-state = { path = "crates/editor/editor-state", version = "0.2.1-crates-io-preview1" }
lumino-project = { path = "crates/core/project", version = "0.2.1-crates-io-preview1" }
lumino-extras = { path = "crates/tools/extras", version = "0.2.1-crates-io-preview1" }
lumino-cloud = { path = "crates/network/cloud", version = "0.2.1-crates-io-preview1" }
# 云存储（FTP / SFTP / WebDAV）
suppaftp = "10.0.1"
# SFTP 使用 russh（纯 Rust，ring 后端无系统依赖；ssh2 vendored-openssl 需 perl 编译 OpenSSL 故弃用）
russh = { version = "0.62.5", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2.4.0"
reqwest_dav = "0.3.3"
reqwest = "0.13"
serde-xml-rs = "0.6"
percent-encoding = "2.3.1"
# 密码加密（AES-256-GCM）— 0.11 与 russh 传递依赖 aes-gcm 0.11 对齐，避免双版本
aes-gcm = "0.11.0"
rand = "0.8"
base64 = "0.22"
async-trait = "0.1"
# crates.io
iced_renderer = { version = "0.14.0", features = ["wgpu", "tiny-skia", "x11", "wayland"] }
iced_core = "0.14.0"
iced = { version = "0.14.0", features = ["wgpu", "canvas"] }
iced_wgpu = "0.14.0"
iced_winit = "0.14.0"
iced_widget = "0.14.0"
wgpu = "27.0"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
thiserror = "2.0.17"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
bincode = "1.3.3"
rgb = "0.8.0"
rfd = "0.15"
tokio = { version = "1.42", features = ["full"] }
anyhow = "1.0"
winit = "0.30"
clap = { version = "4.4", features = ["derive"] }
futures = "0.3.31"
directories = "6.0.0"
toml = "0.9.11"
bytemuck = "1.0"
puffin_http = "0.16.1"
chrono = "0.4"
tokio-test = "0.4"
raw-window-handle = "0.6"
winapi = { version = "0.3", features = ["winuser", "windef", "minwindef", "processthreadsapi", "psapi"] }
muda = "0.17.1"
# xsynth deps
xsynth-core = "0.4.0"
xsynth-soundfonts = "0.4.0"
xsynth-realtime = "0.4.0"
# duplicated dependencies — unified to workspace
zstd = "0.13.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
encoding_rs = "0.8"
num-bigint = "0.4"
puffin = "0.19.1"
parking_lot = "0.12"
hound = "3.5"
flac-encoder = "0.1"
rustc-hash = "2.1"
rayon = "1"
png = "0.17"

# 视频导出计数器模式：TTF/OTF 字体光栅化（中文字符支持）
ab_glyph = "0.2"
# ── UI 基础设施 ──
iced_aw = { version = "0.13.0", features = ["menu"] }
image = "0.25"
once_cell = "1.20"
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"
arboard = "3.4"
im = { version = "15.1.0", features = ["rayon"] }
# ── 渲染 ──
half = "2.4"
naga = "27.0"
# ── 网络 ──
url = "2.5"
tokio-util = "0.7"
tokio-tungstenite = "0.28"
# ── 音频 / MIDI / 播放 ──
libloading = "0.9.0"
midir = "0.10.3"
crossbeam-channel = "0.5"
# ── 系统 / 平台 / 内存分配器 ──
windows = "0.62.2"
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }
tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = "0.6"
# ── 压缩 / 归档 / 文件 ──
unarc-rs = "0.6"
zip = "8" # 8.x 与 unarc-rs 传递依赖对齐，避免双版本
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
iso9660 = "0.1"
tempfile = "3"
memmap2 = "0.9"
crc32fast = "1.3"
# ── 其他 ──
bytes = "1.9"
bit-vec = "0.8"
font-kit = "0.14"
i2m-rs = "0.1.1"
embed-resource = "3.0"

