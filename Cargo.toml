[workspace]
members = ["crates/core", "crates/gfx_wgpu", "crates/midi"]
resolver = "3"

[workspace.package]
version = "0.1.0"
rust-version = "1.92.0"
homepage = "https://github.com/BuickMeow/lumino-rust"
license = "Mulan PSL v2"
edition = "2024"

[package]
name = "lumino-rs"
version.workspace = true
rust-version.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[workspace.dependencies]
lumino-core = { path = "crates/core" }
lumino-gfx-wgpu = { path = "crates/gfx_wgpu" }
lumino-midi = { path = "crates/midi" }

tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"]}

[dependencies]
lumino-core = { workspace = true }
lumino-gfx-wgpu = { workspace = true }
lumino-midi = { workspace = true }

iced = { version = "0.14.0", features = ["svg", "debug"] }
iced_aw = { version = "0.13.0", features = ["menu"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.
