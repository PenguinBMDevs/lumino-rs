[package.metadata.deb]
# maintainer = "PenguinBMDevs"
copyright = "2025-2026, PenguinBMDevs"
license-file = ["LICENSE", "0"]
extended-description = "A fast Black MIDI editor built in Rust."
section = "sound"
priority = "optional"
assets = [
    ["target/release/lumino-rs", "usr/bin/lumino-rs", "755"],
    ["resources/icons/**/*", "usr/share/lumino-rs/resources/icons/", "644"],
]

[package.metadata.generate-rpm]
summary = "Lumino - A Fast Black MIDI Editor"
group = "Applications/Sound"
assets = [
    { source = "target/release/lumino-rs", dest = "/usr/bin/lumino-rs", mode = "0755" },
    { source = "resources/icons/**/*", dest = "/usr/share/lumino-rs/resources/icons/", mode = "0644" },
]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[build-dependencies]
embed-resource = { workspace = true }

[dev-dependencies]
iced_renderer = { workspace = true }
iced_wgpu = { workspace = true }
iced_winit = { workspace = true }
iced_widget = { workspace = true }
iced_core = { workspace = true }
iced = { workspace = true, features = ["image"] }
wgpu = { workspace = true }
chrono = { workspace = true }
tokio-test = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
winapi = { workspace = true }

[[test]]
name = "collaboration_full_test"
path = "tests/collaboration_full_test.rs"

[[test]]
name = "collaboration_ui_test"
path = "tests/collaboration_ui_test.rs"

[profile.fast-release]
inherits = "release"                # 基于 release 默认设置
opt-level = 1                       # 基本优化，编译速度远快于 3
lto = false                         # 禁用链接时优化（大幅减少链接时间）
codegen-units = 16                  # 增加并行代码生成单元（最大 16，加速编译）
debug = 1                           # 行号表（函数名+行号），支持 backtrace 和 profiler
strip = "none"                      # 保留符号用于调试分析（体积换调试能力）
panic = "abort"                    # 使用 abort 而非 unwind（减少生成的代码量）
incremental = true                 # 启用增量编译（对多次构建友好）

[workspace.lints.clippy]
mod_module_files = "deny"  # AGENTS.md：禁止 mod.rs，使用 Rust 2018 模块命名
unwrap_used = "deny"       # AGENTS.md 红线：NEVER use unwrap()（生产 + 测试）
# 注：expect_used 不设全局 deny——测试代码允许 expect（AGENTS.md 规定），
# 而 clippy 无法按 test/生产区分；生产代码的 expect 由 AGENTS.md 规范 + code review 守住。
