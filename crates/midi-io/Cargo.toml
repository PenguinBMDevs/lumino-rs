[package]
name = "lumino-midi-io"
version.workspace = true
rust-version.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
default = ["new-audio-backend"]
new-audio-backend = ["lumino-realtime/xsynth-realtime", "xsynth-core", "xsynth-soundfonts", "cpal", "crossbeam-channel", "spin_sleep"]

[dependencies]
libloading = "0.9.0"
midir = "0.10.3"
thiserror = { workspace = true }
tracing = { workspace = true }
xsynth-core = { workspace = true, optional = true }
xsynth-soundfonts = { workspace = true, optional = true }
lumino-realtime = { workspace = true }
cpal = { version = "0.15", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
spin_sleep = { version = "1.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_Audio"] }