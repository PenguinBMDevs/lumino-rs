[package]
name = "lumino-midi-io"
version.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
description.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
default = ["realtime"]
realtime = ["dep:xsynth-realtime"]
# Tracy 性能剖析：启用后播放线程与 xsynth 音频线程发射 zone（默认构建零开销）
tracy = ["dep:tracy-client", "xsynth-realtime?/tracy", "xsynth-core/tracy"]
# voice 阶段级性能探针：转发 xsynth-core 的 voice_probe feature（默认构建零开销）
voice_probe = ["xsynth-core/voice_probe"]

[dependencies]
lumino-midi-model = { workspace = true }
lumino-midi-loader = { workspace = true }
libloading = { workspace = true }
midir = { workspace = true }
midly = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
xsynth-core = { workspace = true }
xsynth-soundfonts = { workspace = true }
xsynth-realtime = { workspace = true, optional = true }
lumino-gpu-synth = { workspace = true }
lumino-diagnostics = { workspace = true }
parking_lot = { workspace = true }
puffin = { workspace = true }
crossbeam-channel = { workspace = true }
cpal = { workspace = true }
tracy-client = { version = "0.19.0", optional = true, default-features = false, features = [
    "enable",
] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Media_Audio"] }
