[package]
name = "lumino-midi-io"
version.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
description.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
default = ["realtime"]
realtime = ["dep:xsynth-realtime"]

[dependencies]
lumino-midi-model = { workspace = true }
lumino-midi-loader = { workspace = true }
libloading = { workspace = true }
midir = { workspace = true }
midly = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
xsynth-core = { workspace = true }
xsynth-soundfonts = { workspace = true }
xsynth-realtime = { workspace = true, optional = true }
lumino-diagnostics = { workspace = true }
parking_lot = { workspace = true }
puffin = { workspace = true }
crossbeam-channel = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Media_Audio"] }
