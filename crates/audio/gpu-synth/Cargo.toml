[package]
name = "lumino-gpu-synth"
version = "0.1.0"
edition = "2024"
description = "GPU-accelerated real-time MIDI audio synthesizer and offline renderer (SF2 via xsynth-soundfonts, wgpu compute shaders)"
license = "MIT OR Apache-2.0"
keywords = ["midi", "audio", "gpu", "wgpu", "soundfont"]
categories = ["multimedia::audio", "rendering::gpu"]

# REF-LGS-018：继承工作区 lint（`mod_module_files` + `unwrap_used = deny`）。
# 本 crate 原先作为 vendored 子 crate 原样搬入、刻意不继承；现已是现役后端
# （REND-016 / AUD-004 / AUD-008 已接线），质量口径与仓库对齐。
# 白名单（合理保留项 + 理由）见 `crates/audio/gpu-synth/LINTS.md`。
[lints]
workspace = true

[features]
default = []
# REND-019 R5 测试注入（LGS 独立 device）：env LUMINO_TEST_DEVICE_LOST_LGS 触发。
gpu-reconnect-test = []

[dependencies]
lumino-core = { workspace = true }
wgpu = { workspace = true }
lumino-midly = "0.6.2"
xsynth-soundfonts = "0.4.0"
cpal = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
rayon = { workspace = true }
sysinfo = { workspace = true, features = ["system"] }
memmap2 = { workspace = true }
symphonia = { version = "0.5", features = ["default"] }
# REND-016 #139：观测打点需进文件日志（GUI release 无控制台，eprintln 会丢失）。
tracing = { workspace = true }
