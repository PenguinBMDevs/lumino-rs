[package]
name = "lumino-export"
version.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
default = []
# Tracy 剖析：ffmpeg 管道写入 zone（默认零开销）。
tracy = ["dep:tracy-client"]

[dependencies]
# 性能剖析（optional，由 `tracy` feature 开启）
tracy-client = { workspace = true, optional = true }
lumino-core = { workspace = true }
lumino-project = { workspace = true }
lumino-extras = { workspace = true }
lumino-midi-model = { workspace = true }
lumino-midi-loader = { workspace = true }
lumino-diagnostics = { workspace = true }
lumino-midiplayer = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
midly = { workspace = true }
zstd = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
xxhash-rust = { workspace = true }
# 音频渲染依赖
xsynth-core = { workspace = true }
lumino-gpu-synth = { workspace = true }
hound = { workspace = true }
memmap2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
