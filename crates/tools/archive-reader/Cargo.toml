[package]
name = "lumino-archive-reader"
version.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
description = "Lumino - 压缩包内 MIDI 文件自动解压读取器"
edition.workspace = true

[lints]
workspace = true

[dependencies]
# 通用压缩包格式解压（ZIP, RAR, 7z, LZH — unarc-rs 不支持 TAR 大文件和 ZIPX）
unarc-rs = { workspace = true }
# ZIP/ZIPX 标准库（作为 unarc-rs 的 ZIPX 回退）
zip = { workspace = true }
# TAR 格式（替代 unarc-rs，后者处理大文件 TAR 条目会陷入死循环）
tar = { workspace = true }
# GZIP 解压（用于 .tgz / .tar.gz 和纯 GZ 内容检测）
flate2 = { workspace = true }
# XZ 解压（用于 .tar.xz 和纯 XZ 内容检测）
xz2 = { workspace = true }
# ISO 9660 镜像文件
iso9660 = { workspace = true }

# 公用
tracing = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
