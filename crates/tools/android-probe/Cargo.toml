[package]
name = "lumino-android-probe"
version = "0.1.0"
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
description = "Lumino Android 探针（M0）：验证 android-activity + winit + iced_wgpu 链路"
publish = false

[lib]
name = "lumino_probe"
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
log = { workspace = true }
winit = { workspace = true }
futures = { workspace = true }
iced_core = { workspace = true }
iced_widget = { workspace = true }
# iced_widget 依赖 iced_renderer；release 构建下 iced_renderer 若无渲染器特性会
# 直接 compile_error（iced 的硬约束），故显式带上 wgpu/tiny-skia。
iced_renderer = { workspace = true }
iced_wgpu = { workspace = true }
iced_winit = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }
ndk-context = { workspace = true }
android_logger = { workspace = true }
