[package]
name = "lumino-ui-core"
version.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
description.workspace = true
edition.workspace = true

[features]
default = []

[lints]
workspace = true

[dependencies]
iced_core = { workspace = true }
iced_wgpu = { version = "0.14.0", features = ["geometry", "image"] }
iced_widget = { version = "0.14.0", features = ["image"] }
lumino-core = { workspace = true }
lumino-note-core = { workspace = true }
lumino-extras = { workspace = true }
lumino-event = { workspace = true }
lumino-message = { workspace = true }
# 注意：playback / midi-io / midi-loader 依赖已随 midi_state/playback_state
# 上移至 lumino-ui::state（ui-core 保持为 UI 基础层，不依赖业务 crate）
image = "0.25"
once_cell = "1.20"
resvg = "0.44"
thiserror = { workspace = true }
tiny-skia = "0.11"
tracing = { workspace = true }
usvg = "0.44"
