[package]
name = "lumino-export"
version.workspace = true
rust-version.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
lumino-dms = { path = "../dms" }
lumino-core = { path = "../core" }
lumino-midi-io = { path = "../midi-io" }
lumino-midi-loader = { path = "../midi-loader" }
lumino-memory-monitor = { path = "../memory-monitor" }
thiserror = { workspace = true }
tracing = { workspace = true }
midly = { workspace = true }
bytes = "1.9"
encoding_rs = { workspace = true }
num-bigint = { workspace = true }
tokio = { version = "1.42", features = ["fs", "rt"] }
zstd = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# 音频导出依赖
hound = { workspace = true }
flac-encoder = { workspace = true }
xsynth-core = { git = "https://github.com/PenguinBMDevs/xsynth" }
xsynth-soundfonts = { git = "https://github.com/PenguinBMDevs/xsynth" }
rayon = "1.10"
atomic_float = "1.0"
# 工程格式依赖
crc32fast = "1.3"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3.0"
