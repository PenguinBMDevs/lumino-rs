[package]
name = "lumino-ui-egui"
version.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
description.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
default = ["capture"]
# 无头截图（`egui_kittest` 会引入 egui-wgpu + wgpu30）。生产 UI 依赖本 crate 时
# 必须 `default-features = false`，否则主程序会同时链接 wgpu27 与 wgpu30。
capture = ["dep:egui_kittest"]

[dependencies]
lumino-core = { workspace = true }
lumino-message = { workspace = true }
lumino-arrangement-core = { workspace = true }
lumino-extras = { workspace = true }
lumino-editor-state = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
egui_kittest = { workspace = true, optional = true }
fontdb = { workspace = true }
resvg = { workspace = true }
usvg = { workspace = true }
tiny-skia = { workspace = true }
once_cell = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "capture_egui"
path = "src/bin/capture_egui.rs"

[[bin]]
name = "compare_egui"
path = "src/bin/compare_egui.rs"

[dev-dependencies]
lumino-egui-bridge = { workspace = true }
pollster = { workspace = true }
wgpu = { workspace = true }
