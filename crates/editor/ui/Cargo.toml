[package]
name = "lumino-ui"
version.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
description.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
default = []
# 可选编译：yinhe 副模式（发布形态 --features yinhe）
# P7 约束：数据模型直接用 Lumino 工程格式，混音台不迁，多文档不做，
# i18n 按 lumino，快捷键统一复用罗盘，不新定义 Keybindings 持久化
yinhe = ["dep:lumino-ui-yinhe"]

[dependencies]
lumino-core = { workspace = true }
lumino-note-core = { workspace = true }
lumino-extras = { workspace = true }
lumino-export = { workspace = true }
lumino-project = { workspace = true }
lumino-editor-state = { workspace = true }
lumino-gfx = { workspace = true }
lumino-message = { workspace = true }
lumino-midi-io = { workspace = true }
lumino-midi-loader = { workspace = true }
lumino-diagnostics = { workspace = true }
lumino-collaboration = { workspace = true }
# lumino-ui-constants: merged into lumino-ui-core::constants
lumino-ui-core = { workspace = true }
# lumino-ui-host: merged into lumino-gfx::cache
lumino-ui-settings = { workspace = true }
lumino-ui-editor = { workspace = true }
lumino-ui-yinhe = { workspace = true, optional = true }
# crates.io
midly = { workspace = true }
# crates.io
iced_renderer = { workspace = true }
iced_aw = { workspace = true }
iced_wgpu = { workspace = true, features = ["geometry", "svg"] }
iced_winit = { workspace = true }
iced_widget = { workspace = true, features = ["image", "wgpu", "svg"] }
iced_core = { workspace = true }
image = { workspace = true }
once_cell = { workspace = true }
rfd = { workspace = true }
tracing = { workspace = true }
resvg = { workspace = true }
usvg = { workspace = true }
tiny-skia = { workspace = true }
arboard = { workspace = true }
serde_json = { workspace = true }
im = { workspace = true }
puffin = { workspace = true }
winit = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
parking_lot = { workspace = true }
i2m-rs = { workspace = true }

[dev-dependencies]
wgpu = { workspace = true }
tokio = { workspace = true }
