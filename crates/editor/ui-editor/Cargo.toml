[package]
name = "lumino-ui-editor"
version.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
description.workspace = true
edition.workspace = true

[features]
default = []

[lints]
workspace = true

[[bench]]
name = "id_history_ops_bench"
harness = false

[[bench]]
name = "ui_boxselect_copy_bench"
harness = false

# 删除性能基准（全量轨 1900W 音符，删除/撤销 ≤100ms 门控）
[[bench]]
name = "ui_delete_bench"
harness = false

[dev-dependencies]
# bench 目标以 release/bench profile 编译：iced_widget 会拉入未开 renderer feature 的
# iced_renderer（release 下直接 compile_error）。显式开启与 workspace 一致的 feature。
iced_renderer = { workspace = true }

[dependencies]
iced_core = { workspace = true }
iced_wgpu = { workspace = true, features = ["geometry", "image"] }
iced_widget = { workspace = true, features = ["image", "canvas"] }
ab_glyph = { workspace = true }
lumino-core = { workspace = true }
lumino-note-core = { workspace = true }
lumino-extras = { workspace = true }
lumino-editor-state = { workspace = true }
lumino-gfx = { workspace = true }
lumino-midi-loader = { workspace = true }
lumino-ui-core = { workspace = true }
# lumino-ui-constants: merged into lumino-ui-core::constants
lumino-message = { workspace = true }
lumino-diagnostics = { workspace = true }
lumino-midi-model = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true }
once_cell = { workspace = true }
thiserror = { workspace = true }
im = { workspace = true }
serde_json = { workspace = true }
puffin = { workspace = true }
arboard = { workspace = true }
winapi = { workspace = true }
