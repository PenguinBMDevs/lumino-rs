[package]
name = "lumino-gfx"
version.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
description.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
default = []
# R2 真实重连冒烟注入（REND-019 §三 R2）：env LUMINO_TEST_DEVICE_LOST 触发
# device.destroy() 注入，走与真实 TDR 相同的 device-lost 回调路径。
gpu-reconnect-test = []

[dependencies]
wgpu = { workspace = true }
ab_glyph = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
log = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
puffin = { workspace = true }
half = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
im = { workspace = true }
rayon = { workspace = true }
crossbeam-channel = { workspace = true }
lumino-core = { workspace = true }
lumino-note-core = { workspace = true }
lumino-editor-state = { workspace = true }
lumino-midi-loader = { workspace = true }
lumino-midiplayer = { workspace = true }
lumino-diagnostics = { workspace = true }

[dev-dependencies]
naga = { workspace = true }
png = { workspace = true }
