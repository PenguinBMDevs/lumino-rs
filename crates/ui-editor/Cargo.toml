[package]
name = "lumino-ui-editor"
version.workspace = true
rust-version.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[features]
default = []

[lints]
workspace = true

[dependencies]
iced_core = "0.14.0"
iced_wgpu = { version = "0.14.0", features = ["geometry", "image"] }
iced_widget = { version = "0.14.0", features = ["image", "canvas"] }
lumino-core = { workspace = true }
lumino-gfx = { workspace = true }
lumino-midi-loader = { workspace = true }
lumino-ui-core = { path = "../ui-core" }
lumino-ui-constants = { path = "../ui-constants" }
lumino-message = { workspace = true }
lumino-event = { workspace = true }
lumino-memtrace = { workspace = true }
rayon = "1.10"
tracing = { workspace = true }
once_cell = "1.20"
thiserror = { workspace = true }
im = { version = "15.1.0", features = ["rayon"] }
serde_json = { workspace = true }
puffin = { workspace = true }
arboard = "3.4"
