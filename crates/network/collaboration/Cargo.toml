[package]
name = "lumino-collaboration"
version.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
description.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
lumino-core = { workspace = true }
lumino-midi-loader = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

# WebSocket客户端（非Windows用rustls，Windows用native-tls）
futures = { workspace = true }
url = { workspace = true }

# 异步运行时工具
tokio-util = { workspace = true }

# HTTP 客户端（非Windows用rustls，Windows用native-tls）

[target.'cfg(not(target_os = "windows"))'.dependencies]
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
reqwest = { workspace = true, features = ["json", "rustls", "query"] }

[target.'cfg(target_os = "windows")'.dependencies]
tokio-tungstenite = { workspace = true, features = ["native-tls"] }
reqwest = { workspace = true, features = ["json", "native-tls", "query"] }

[dev-dependencies]
tokio-test = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
