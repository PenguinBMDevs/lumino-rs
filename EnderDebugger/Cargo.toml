[package]
name = "ender_debugger"
version = "0.1.0"
edition = "2021"

[lib]
name = "ender_debugger"
path = "src/lib.rs"

[[bin]]
name = "log_viewer"
path = "src/bin/log_viewer.rs"

[dependencies]
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
once_cell = "1"
clap = { version = "4", features = ["derive"] }
# fs2 removed; std::fs::File::sync_all used instead
uuid = { version = "1", features = ["v4"] }
ctrlc = "3"
