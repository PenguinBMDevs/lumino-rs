name: Multi-Platform Rust Build

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Build mode (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      version:
        description: 'Version (e.g., 0.1.0)'
        required: true
        type: string
        default: '0.1.0'
      preview_number:
        description: 'Preview number (e.g., 1 for preview1)'
        required: true
        type: number
        default: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------- Linux ----------
          - target: x86_64-unknown-linux-musl
            os_name: Linux
            arch: x86_64
            extension: ""
          - target: aarch64-unknown-linux-musl
            os_name: Linux
            arch: aarch64
            extension: ""
          - target: armv7-unknown-linux-musleabihf
            os_name: Linux
            arch: armv7
            extension: ""

          # ---------- Windows ----------
          - target: x86_64-pc-windows-gnu
            os_name: Windows
            arch: x86_64
            extension: .exe
          - target: i686-pc-windows-gnu
            os_name: Windows
            arch: x86
            extension: .exe
          - target: aarch64-pc-windows-msvc
            os_name: Windows
            arch: arm64
            extension: .exe

          # ---------- macOS ----------
          - target: x86_64-apple-darwin
            os_name: macOS
            arch: x86_64
            extension: ""
          - target: aarch64-apple-darwin
            os_name: macOS
            arch: arm64
            extension: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (Release)
        if: ${{ github.event.inputs.release_mode == 'release' }}
        run: cross build --target ${{ matrix.target }} --release

      - name: Build (Debug)
        if: ${{ github.event.inputs.release_mode == 'debug' }}
        run: cross build --target ${{ matrix.target }}

      - name: Generate output filename
        id: filename
        run: |
          # 获取输入参数
          VERSION="${{ github.event.inputs.version }}"
          PREVIEW_NUM="${{ github.event.inputs.preview_number }}"
          OS_NAME="${{ matrix.os_name }}"
          ARCH="${{ matrix.arch }}"
          EXT="${{ matrix.extension }}"

          # 构建文件名：Lumino-v{version}-preview{次数}-{OS}-{Arch}{扩展名}
          FILENAME="Lumino-v${VERSION}-preview${PREVIEW_NUM}-${OS_NAME}-${ARCH}${EXT}"

          echo "filename=${FILENAME}" >> $GITHUB_OUTPUT
          echo "Generated filename: ${FILENAME}"

      - name: Rename binary
        run: |
          BUILD_TYPE="${{ github.event.inputs.release_mode == 'release' && 'release' || 'debug' }}"
          SOURCE_FILE="target/${{ matrix.target }}/${BUILD_TYPE}/lumino-rs${{ matrix.extension }}"
          TARGET_FILE="${{ steps.filename.outputs.filename }}"

          # 检查源文件是否存在
          if [ -f "$SOURCE_FILE" ]; then
            mv "$SOURCE_FILE" "$TARGET_FILE"
            echo "Renamed to: $TARGET_FILE"
          else
            echo "Source file not found: $SOURCE_FILE"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.filename.outputs.filename }}
          path: ${{ steps.filename.outputs.filename }}
          if-no-files-found: error
