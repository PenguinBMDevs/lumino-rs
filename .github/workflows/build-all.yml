name: Multi-Platform Rust Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 0.1.0)'
        required: true
        type: string
        default: '0.1.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "--cap-lints warn"

jobs:
  # ==================== Linux x86_64 ====================
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo registry & git
        uses: actions/cache@v5.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config nasm libclang-dev clang \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libgtk-3-dev libx11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev \
            libxkbcommon-dev libvulkan-dev libssl-dev libzstd-dev \
            libtiff-dev libpng-dev libjpeg-dev libwebp-dev libgif-dev \
            libpulse-dev libdbus-1-dev libxi-dev libxtst-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libxdamage-dev libpq-dev libsqlite3-dev

      - name: Build (release)
        run: cargo build --target x86_64-unknown-linux-gnu --release

      - name: Generate filename
        id: filename
        run: |
          FILENAME="Lumino-v${{ github.event.inputs.version }}-Linux-x86_64"
          echo "filename=${FILENAME}" >> $GITHUB_OUTPUT

      - name: Rename binary
        run: |
          mv "target/x86_64-unknown-linux-gnu/release/lumino-rs" \
             "${{ steps.filename.outputs.filename }}"

      - uses: actions/upload-artifact@v6.0.0
        with:
          name: ${{ steps.filename.outputs.filename }}
          path: ${{ steps.filename.outputs.filename }}
          if-no-files-found: error

  # ==================== Linux ARM64（GitHub 原生 ARM 运行器）====================
  build-linux-arm64:
    name: Build Linux arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache cargo registry & git
        uses: actions/cache@v5.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arm64-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config nasm libclang-dev clang \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libgtk-3-dev libx11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev \
            libxkbcommon-dev libvulkan-dev libssl-dev libzstd-dev \
            libtiff-dev libpng-dev libjpeg-dev libwebp-dev libgif-dev \
            libpulse-dev libdbus-1-dev libxi-dev libxtst-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libxdamage-dev libpq-dev libsqlite3-dev

      - name: Build (release)
        run: cargo build --target aarch64-unknown-linux-gnu --release

      - name: Generate filename
        id: filename
        run: |
          FILENAME="Lumino-v${{ github.event.inputs.version }}-Linux-arm64"
          echo "filename=${FILENAME}" >> $GITHUB_OUTPUT

      - name: Rename binary
        run: |
          mv "target/aarch64-unknown-linux-gnu/release/lumino-rs" \
             "${{ steps.filename.outputs.filename }}"

      - uses: actions/upload-artifact@v6.0.0
        with:
          name: ${{ steps.filename.outputs.filename }}
          path: ${{ steps.filename.outputs.filename }}
          if-no-files-found: error

  # ==================== Windows ====================
  build-windows:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x86_64
            extension: .exe
          - target: aarch64-pc-windows-msvc
            arch: arm64
            extension: .exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & git
        uses: actions/cache@v5.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install LLVM (for bindgen)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17"

      - name: Build (release)
        shell: pwsh
        run: cargo build --target ${{ matrix.target }} --release

      - name: Generate filename
        id: filename
        shell: bash
        run: |
          FILENAME="Lumino-v${{ github.event.inputs.version }}-Windows-${{ matrix.arch }}${{ matrix.extension }}"
          echo "filename=${FILENAME}" >> $GITHUB_OUTPUT

      - name: Rename binary
        shell: pwsh
        run: |
          Move-Item "target/${{ matrix.target }}/release/lumino-rs${{ matrix.extension }}" \
                    "${{ steps.filename.outputs.filename }}"

      - uses: actions/upload-artifact@v6.0.0
        with:
          name: ${{ steps.filename.outputs.filename }}
          path: ${{ steps.filename.outputs.filename }}
          if-no-files-found: error

  # ==================== macOS ====================
  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x86_64
            extension: ""
          - target: aarch64-apple-darwin
            arch: arm64
            extension: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & git
        uses: actions/cache@v5.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install dependencies
        run: brew install cmake pkg-config nasm llvm

      - name: Set environment variables
        run: echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Build (release)
        run: cargo build --target ${{ matrix.target }} --release

      - name: Generate filename
        id: filename
        run: |
          FILENAME="Lumino-v${{ github.event.inputs.version }}-macOS-${{ matrix.arch }}"
          echo "filename=${FILENAME}" >> $GITHUB_OUTPUT

      - name: Rename binary
        run: |
          mv "target/${{ matrix.target }}/release/lumino-rs" \
             "${{ steps.filename.outputs.filename }}"

      - uses: actions/upload-artifact@v6.0.0
        with:
          name: ${{ steps.filename.outputs.filename }}
          path: ${{ steps.filename.outputs.filename }}
          if-no-files-found: error

  # ==================== Release（需手动审批）====================
  release:
    name: Create Release
    needs:
      - build-linux-x86_64
      - build-linux-arm64
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    environment: release          # ← 在仓库 Settings → Environments 中配置 required reviewers
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6.0.0
        with:
          path: artifacts/

      - name: List downloaded artifacts
        run: find artifacts -type f -exec ls -la {} \;

      - name: Create Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          draft: true            # 创建为草稿，需人工在 Releases 页面手动 Publish
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
