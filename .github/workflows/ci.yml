name: CI Check

on:
  push:
    branches-ignore: []
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── BOM 守卫：独立 ubuntu job（与 lint 同级的门禁）─────────────────
  # 单独开一台 ubuntu 机器专跑这个扫描，不占 3-OS lint 矩阵的 windows/macos 机位：
  # 无 apt、无 Rust 工具链、无 cargo 缓存依赖，秒级返回。
  # 检出任意 .rs 文件头 BOM（EF BB BF）即红，拦住编辑器保存行为的回流。
  bom-guard:
    name: BOM Guard (*.rs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # 显式用 bash 调用，不依赖脚本的 git 可执行位（Windows 检出下不可靠）
      - name: Check UTF-8 BOM in *.rs
        run: bash scripts/check-bom.sh

  # ── 文件行数守卫：独立 ubuntu job（仓库硬规「单文件 < 400 行」）────
  # DEBT-09 #126：存量超限文件列入 scripts/file-length-whitelist.txt；
  # 未登记的超限文件直接红，防止拆分后回涨。
  file-length-guard:
    name: File Length Guard (*.rs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check *.rs line count (400 limit + whitelist)
        run: bash scripts/check-file-length.sh

  # ── 静态检查：cargo check + cargo clippy（×3 OS 并行）──────────────
  # check 与 clippy 同机串行，避免重复拉取依赖；test 单独成 job 并行跑。
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libasound2-dev \
            libvulkan-dev \
            libx11-dev \
            libwayland-dev \
            libfontconfig-dev \
            libfreetype6-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # 优化后的缓存配置：支持降级匹配
      - name: Cache cargo & target
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo check
        run: cargo check --workspace

      # clippy 门禁（全 workspace，所有 target，-D warnings）
      # 说明：历史债务清理后 workspace 已可全绿。后续新增代码若触发
      # too_many_arguments / large_enum_variant，优先参数结构体化或 Box 化，
      # 禁止无差别 #[allow]。当前临时 allow 的枚举已在源码中标注 TODO(P3)。
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── 测试：cargo test（×3 OS 并行）────────────────────────────────
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libasound2-dev \
            libvulkan-dev \
            libx11-dev \
            libwayland-dev \
            libfontconfig-dev \
            libfreetype6-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo & target
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo test
        run: cargo test --workspace
        env:
          MIMALLOC_SYS_USE_STATIC_CRT: 1   # 强制 mimalloc 使用静态 CRT，解决 Windows 链接冲突
          LUMINO_MEMORY_SOFT_LIMIT_MB: 65536   # 64 GiB：避免 runner 内存紧张触发测试内 OOM panic

  # ── 金丝雀构建：Windows x64 release → 推 Hugging Face ─────────────
  # 与门禁并行，不等 lint/test。push 即构建，炸了下次 push 自然覆盖。
  # 文件名：Lumino-rs_Canary_Dev-prewiew_<short-sha>_<yyyymmdd>.exe
  canary:
    name: Canary Build & Publish
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ── canary 专属缓存命名空间 ────────────────────────────────────
      # canary 走的是 release profile + --target，lint/test 走 debug profile，
      # 两边不可能互用编译产物（fingerprint 按 profile/target 分家）：
      #   release + --target 的布局实测为
      #     target/<triple>/release/**  ← 目标侧：deps 的 rlib、最终 exe
      #     target/release/**           ← 宿主侧：build script、proc-macro
      # 而 lint/test 只有 target/debug。所以 canary 必须自带一套缓存，
      # 靠 lint/test 的 key 只能捞到 ~/.cargo（profile 无关的源码包）。
      # 另外 actions/cache 的 key 不可变：三个 job 共用同一个 key 时只有最先跑完的
      # 能写入，canary 的 release target 永远存不进去 → 每轮冷编译。
      # 故 canary 单开命名空间（对齐 build-all.yml 的 per-target 做法），
      # 并在构建后显式上传，不走 post 钩子（post-if: success()）。
      - name: Restore cargo cache (canary)
        id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          # 只列 canary 自己会产出的目录：降级命中 lint/test 的缓存时只捞 ~/.cargo，
          # 不把几个 GB 的 target/debug 一起下载/回写；顶层 target/release 是宿主单元，
          # 少了它每轮都要重编全部 proc-macro/build script
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/x86_64-pc-windows-msvc
            target/release
          key: ${{ runner.os }}-cargo-canary-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-canary-
            ${{ runner.os }}-cargo-

      # runner 默认就是 x86_64，显式声明 target 防配置漂移
      - name: Build release (x86_64-pc-windows-msvc)
        run: cargo build --release --target x86_64-pc-windows-msvc
        env:
          MIMALLOC_SYS_USE_STATIC_CRT: 1   # 与 test job 保持一致的 mimalloc 静态 CRT 配置

      # 显式上传缓存（canary 的核心诉求）：
      #   - always()：构建半途失败也把已编好的依赖落盘，cargo 下轮续编
      #   - cache-hit != 'true'：主 key 精确命中时无新内容可写，跳过（也避免重复写报错）
      #   - continue-on-error：缓存写失败（并发同 key、缓存服务抖动）不拖累后面的发版
      - name: Save cargo cache (canary)
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6.1.0
        with:
          # 与 restore 的 path 保持一致：目标侧 + 宿主侧，release 才真的能续编
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/x86_64-pc-windows-msvc
            target/release
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Upload canary to Hugging Face
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_DATE="$(date -u +%Y%m%d)"
          CANARY_NAME="Lumino-rs_Canary_Dev-Preview_${SHORT_SHA}_${BUILD_DATE}.exe"

          cp "target/x86_64-pc-windows-msvc/release/lumino-rs.exe" "$CANARY_NAME"

          pip install --quiet huggingface_hub
          python -c "
          from huggingface_hub import HfApi
          api = HfApi(token='$HF_TOKEN')
          api.upload_file(
              path_or_fileobj='$CANARY_NAME',
              path_in_repo='$CANARY_NAME',
              repo_id='PenguinBMDevs/lumino-canary',
              repo_type='model',
              commit_message=f'canary: ${SHORT_SHA} (${BUILD_DATE})',
          )
          print('Uploaded: $CANARY_NAME')
          "
