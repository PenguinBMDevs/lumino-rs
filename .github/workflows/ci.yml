name: CI Check

on:
  push:
    branches-ignore: []
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libasound2-dev \
            libvulkan-dev \
            libx11-dev \
            libwayland-dev \
            libfontconfig-dev \
            libfreetype6-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 优化后的缓存配置：支持降级匹配
      - name: Cache cargo & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 先检查（会利用缓存编译依赖）
      - name: Cargo check
        run: cargo check --workspace

      # 测试（链接时使用修复的环境变量，仅 Windows 生效）
      - name: Cargo test
        run: cargo test --workspace
        env:
          MIMALLOC_SYS_USE_STATIC_CRT: 1   # 强制 mimalloc 使用静态 CRT，解决 Windows 链接冲突
