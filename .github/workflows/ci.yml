name: CI Check

on:
  push:
    branches-ignore: []
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 2026-11-27：GitHub 偶发对匿名 git 拉取返回 403（xsynth-Lumino），3 次重试不够。
# 提高 cargo 网络重试；并在各 job 用 actions/cache 缓存 ~/.cargo/git。
env:
  CARGO_NET_RETRY: 10

jobs:
  # ── BOM 守卫：独立 ubuntu job（与 lint 同级的门禁）─────────────────
  # 单独开一台 ubuntu 机器专跑这个扫描，不占 3-OS lint 矩阵的 windows/macos 机位：
  # 无 apt、无 Rust 工具链、无 cargo 缓存依赖，秒级返回。
  # 检出任意 .rs 文件头 BOM（EF BB BF）即红，拦住编辑器保存行为的回流。
  bom-guard:
    name: BOM Guard (*.rs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # 显式用 bash 调用，不依赖脚本的 git 可执行位（Windows 检出下不可靠）
      - name: Check UTF-8 BOM in *.rs
        run: bash scripts/check-bom.sh

  # ── 静态检查：cargo check + cargo clippy（×3 OS 并行）──────────────
  # check 与 clippy 同机串行，避免重复拉取依赖；test 单独成 job 并行跑。
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # mesa-vulkan-drivers = lavapipe（Vulkan 软件实现，含 ICD 清单）。
          # 本项目目标后端就是 Vulkan（macOS 为 Metal，见 device_check::required_backend_name），
          # 只装 libvulkan-dev（头文件 + loader）而没有 ICD 时 runner 上枚举不到 Vulkan
          # 适配器，wgpu 会静默退到 GLES；而 wgpu-hal 的 GLES adapter context 是
          # try_lock + panic（"Could not lock adapter context"），并行测试必然假死失败。
          sudo apt-get install -y \
            mesa-vulkan-drivers \
            libssl-dev \
            libasound2-dev \
            libvulkan-dev \
            libx11-dev \
            libwayland-dev \
            libfontconfig-dev \
            libfreetype6-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # HF 缓存只读：每类机器一个 zstd 包，见 .github/actions/hf-cache。
      # 写入统一收敛到 hf-cache-refresh.yml（每 3 天全量重建），
      # 日常 CI 不再回写，避免不同 run 互相覆盖/污染。缓存范围仅项目 target。
      # git 依赖（xsynth-Lumino）单独缓存：2026-11-27 GitHub 偶发对匿名
      # clone 返回 403，缓存命中时无需再拉；未命中时靠 CARGO_NET_RETRY=10 重试。
      - name: Cache cargo git dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: cargo-git-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-git-${{ runner.os }}-

      - name: HF cache (restore)
        uses: ./.github/actions/hf-cache
        with:
          archive: ci-lint-${{ matrix.os }}.tar.zst
          paths: |
            target
          hf-token: ${{ secrets.HF_TOKEN }}

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --workspace

      # clippy 门禁（全 workspace，所有 target，-D warnings）
      # 说明：历史债务清理后 workspace 已可全绿。后续新增代码若触发
      # too_many_arguments / large_enum_variant，优先参数结构体化或 Box 化，
      # 禁止无差别 #[allow]。当前临时 allow 的枚举已在源码中标注 TODO(P3)。
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── 测试：cargo nextest（×3 OS 并行）─────────────────────────────
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # mesa-vulkan-drivers = lavapipe（Vulkan 软件实现，含 ICD 清单）。
          # 本项目目标后端就是 Vulkan（macOS 为 Metal，见 device_check::required_backend_name），
          # 只装 libvulkan-dev（头文件 + loader）而没有 ICD 时 runner 上枚举不到 Vulkan
          # 适配器，wgpu 会静默退到 GLES；而 wgpu-hal 的 GLES adapter context 是
          # try_lock + panic（"Could not lock adapter context"），并行测试必然假死失败。
          sudo apt-get install -y \
            mesa-vulkan-drivers \
            libssl-dev \
            libasound2-dev \
            libvulkan-dev \
            libx11-dev \
            libwayland-dev \
            libfontconfig-dev \
            libfreetype6-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev

      # 只打印枚举结果，不参与判定：下次若再出现「无适配器 / 回退 GLES」，
      # 日志里直接能看到后端与驱动，不必再靠 wgpu-hal 的 panic 栈反推。
      - name: Vulkan ICD diagnostic (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y vulkan-tools
          vulkaninfo --summary 2>&1 | head -40 || true

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 统一 runner：所有测试走 nextest（见 AGENTS.md Test Commands）。
      # 用预编译二进制安装，避免每个 OS 都 cargo install 一遍。
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # 只读缓存：定时刷新见 hf-cache-refresh.yml。
      # git 依赖（xsynth-Lumino）单独缓存：2026-11-27 GitHub 偶发对匿名
      # clone 返回 403，缓存命中时无需再拉；未命中时靠 CARGO_NET_RETRY=10 重试。
      - name: Cache cargo git dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: cargo-git-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-git-${{ runner.os }}-

      - name: HF cache (restore)
        uses: ./.github/actions/hf-cache
        with:
          archive: ci-test-${{ matrix.os }}.tar.zst
          paths: |
            target
          hf-token: ${{ secrets.HF_TOKEN }}

      # Python 仅用于把 nextest 的 JSON 流转成 JUnit XML（三平台统一用 `python`）。
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      # ── Windows 测试（并行，与另外两个 OS 一致）──────────────────────
      # 2026-10-31 曾在此临时改成 `--test-threads=1` 规避 gfx 单测连锁失败，
      # 但串行化并未解决问题（真因是「驻留共享 Device + `device_check` 反复
      # 建/销探测 Device」的 DX12 组合），反而让 `lumino-midi-io` 的音频设备
      # 用例抛 STATUS_ACCESS_VIOLATION（并行模式下从未复现）。真因已由
      # `cpu_onion_renderer::tests_support::transient_device` 修复，故恢复并行。
      #
      # JUnit 生成：nextest 0.9 已移除 `--junit-xml`，改为输出 libtest JSON 流，
      # 由 scripts/nextest_junit.py 转成标准 JUnit XML 供 Pages 报告使用。
      # 测试失败时仍要继续产出报告，故 continue-on-error + 末尾统一判失败。
      - name: Cargo test (nextest)
        id: nextest
        continue-on-error: true
        shell: bash
        run: |
          cargo nextest run --workspace --no-fail-fast \
            --message-format libtest-json-plus \
            > nextest-${{ matrix.os }}.ndjson
        env:
          NEXTEST_EXPERIMENTAL_LIBTEST_JSON: 1
          MIMALLOC_SYS_USE_STATIC_CRT: 1   # 强制 mimalloc 使用静态 CRT，解决 Windows 链接冲突
          LUMINO_MEMORY_SOFT_LIMIT_MB: 65536   # 64 GiB：避免 runner 内存紧张触发测试内 OOM panic

      - name: Convert to JUnit XML
        if: always()
        run: >-
          python scripts/nextest_junit.py nextest-${{ matrix.os }}.ndjson
          -o junit-${{ matrix.os }}.xml
          --name "nextest (${{ matrix.os }})"

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: junit-${{ matrix.os }}
          path: junit-${{ matrix.os }}.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Fail job on test failures
        if: steps.nextest.outcome == 'failure'
        run: |
          echo "::error::nextest reported failing tests; see the junit-${{ matrix.os }} artifact / Pages test report."
          exit 1

      # nextest 不执行 doctest：单独补一层门禁（这是唯一保留 cargo test 的场景）。
      - name: Cargo doctests
        run: cargo test --doc --workspace
        env:
          MIMALLOC_SYS_USE_STATIC_CRT: 1
          LUMINO_MEMORY_SOFT_LIMIT_MB: 65536

      # 无外部服务器的协议、状态机与序列化回归；真实服务器 E2E 仍保留 ignored 人工门禁。
      - name: Collaboration offline regression
        run: cargo nextest run -p lumino-collaboration
        env:
          MIMALLOC_SYS_USE_STATIC_CRT: 1
          LUMINO_MEMORY_SOFT_LIMIT_MB: 65536

  # ── 金丝雀构建：Windows x64 release → 推 Hugging Face ─────────────
  # 与门禁并行，不等 lint/test。push 即构建，炸了下次 push 自然覆盖。
  # 文件名：Lumino-rs_Canary_Dev-prewiew_<short-sha>_<yyyymmdd>.exe
  canary:
    name: Canary Build & Publish
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ── canary 专属缓存命名空间 ────────────────────────────────────
      # canary 走的是 release profile + --target，lint/test 走 debug profile，
      # 两边不可能互用编译产物（fingerprint 按 profile/target 分家）：
      #   release + --target 的布局实测为
      #     target/<triple>/release/**  ← 目标侧：deps 的 rlib、最终 exe
      #     target/release/**           ← 宿主侧：build script、proc-macro
      # 而 lint/test 只有 target/debug。所以 canary 必须自带一套缓存，
      # 单开命名空间，路径只列自己会产出的目录（顶层 target/release 是
      # 宿主单元，少了它每轮都要重编全部 proc-macro/build script）。
      # canary 缓存也由 hf-cache-refresh.yml 每 3 天刷新；本 job 只读。
      # git 依赖（xsynth-Lumino）单独缓存：2026-11-27 GitHub 偶发对匿名
      # clone 返回 403，缓存命中时无需再拉；未命中时靠 CARGO_NET_RETRY=10 重试。
      - name: Cache cargo git dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: cargo-git-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-git-${{ runner.os }}-

      - name: HF cache (restore, canary)
        uses: ./.github/actions/hf-cache
        with:
          archive: ci-canary-windows-latest.tar.zst
          paths: |
            target/x86_64-pc-windows-msvc
            target/release
          hf-token: ${{ secrets.HF_TOKEN }}

      # runner 默认就是 x86_64，显式声明 target 防配置漂移
      - name: Build release (x86_64-pc-windows-msvc)
        run: cargo build --release --target x86_64-pc-windows-msvc
        env:
          MIMALLOC_SYS_USE_STATIC_CRT: 1   # 与 test job 保持一致的 mimalloc 静态 CRT 配置

      - name: Upload canary to Hugging Face
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_DATE="$(date -u +%Y%m%d)"
          CANARY_NAME="Lumino-rs_Canary_Dev-Preview_${SHORT_SHA}_${BUILD_DATE}.exe"

          cp "target/x86_64-pc-windows-msvc/release/lumino-rs.exe" "$CANARY_NAME"

          pip install --quiet huggingface_hub
          python -c "
          from huggingface_hub import HfApi
          api = HfApi(token='$HF_TOKEN')
          api.upload_file(
              path_or_fileobj='$CANARY_NAME',
              path_in_repo='$CANARY_NAME',
              repo_id='PenguinBMDevs/lumino-canary',
              repo_type='model',
              commit_message=f'canary: ${SHORT_SHA} (${BUILD_DATE})',
          )
          print('Uploaded: $CANARY_NAME')
          "
