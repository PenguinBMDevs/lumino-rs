name: Multi-Platform Rust Build

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Build mode (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      version:
        description: 'Version (e.g., 0.1.0)'
        required: true
        type: string
        default: '0.1.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "--cap-lints warn"

jobs:
  build-linux:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            extension: ""
            linker: x86_64-linux-gnu-gcc
            cross_packages: ""
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            extension: ""
            linker: aarch64-linux-gnu-gcc
            cross_packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
          - target: armv7-unknown-linux-gnueabihf
            arch: armv7
            extension: ""
            linker: arm-linux-gnueabihf-gcc
            cross_packages: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6-dev-armhf-cross
    env:
      CARGO_TARGET_${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'AARCH64_UNKNOWN_LINUX_GNU' || matrix.target == 'armv7-unknown-linux-gnueabihf' && 'ARMV7_UNKNOWN_LINUX_GNUEABIHF' || 'X86_64_UNKNOWN_LINUX_GNU' }}_LINKER: ${{ matrix.linker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            nasm \
            libclang-dev \
            clang \
            libasound2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libgtk-3-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libvulkan-dev \
            libssl-dev \
            libzstd-dev \
            libtiff-dev \
            libpng-dev \
            libjpeg-dev \
            libwebp-dev \
            libgif-dev \
            libpulse-dev \
            libdbus-1-dev \
            libxi-dev \
            libxtst-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libpq-dev \
            libsqlite3-dev \
            ${{ matrix.cross_packages }}

      - name: Build
        run: |
          if [ "${{ github.event.inputs.release_mode }}" = "release" ]; then
            cargo build --target ${{ matrix.target }} --release
          else
            cargo build --target ${{ matrix.target }}
          fi

      - name: Generate filename
        id: filename
        run: |
          FILENAME="Lumino-v${{ github.event.inputs.version }}-Linux-${{ matrix.arch }}${{ matrix.extension }}"
          echo "filename=${FILENAME}" >> $GITHUB_OUTPUT

      - name: Rename binary
        run: |
          BUILD_TYPE="${{ github.event.inputs.release_mode == 'release' && 'release' || 'debug' }}"
          mv "target/${{ matrix.target }}/${BUILD_TYPE}/lumino-rs${{ matrix.extension }}" "${{ steps.filename.outputs.filename }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.filename.outputs.filename }}
          path: ${{ steps.filename.outputs.filename }}
          if-no-files-found: error

  build-windows:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x86_64
            extension: .exe
          - target: aarch64-pc-windows-msvc
            arch: arm64
            extension: .exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install LLVM (for bindgen)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17"

      - name: Build
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.release_mode }}" -eq "release") {
            cargo build --target ${{ matrix.target }} --release
          } else {
            cargo build --target ${{ matrix.target }}
          }

      - name: Generate filename
        id: filename
        shell: bash
        run: |
          FILENAME="Lumino-v${{ github.event.inputs.version }}-Windows-${{ matrix.arch }}${{ matrix.extension }}"
          echo "filename=${FILENAME}" >> $GITHUB_OUTPUT

      - name: Rename binary
        shell: pwsh
        run: |
          $BUILD_TYPE = if ("${{ github.event.inputs.release_mode }}" -eq "release") { "release" } else { "debug" }
          Move-Item "target/${{ matrix.target }}/${BUILD_TYPE}/lumino-rs${{ matrix.extension }}" "${{ steps.filename.outputs.filename }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.filename.outputs.filename }}
          path: ${{ steps.filename.outputs.filename }}
          if-no-files-found: error

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x86_64
            extension: ""
          - target: aarch64-apple-darwin
            arch: arm64
            extension: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: |
          brew install cmake pkg-config nasm llvm

      - name: Set environment variables
        run: |
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          if [ "${{ github.event.inputs.release_mode }}" = "release" ]; then
            cargo build --target ${{ matrix.target }} --release
          else
            cargo build --target ${{ matrix.target }}
          fi

      - name: Generate filename
        id: filename
        run: |
          FILENAME="Lumino-v${{ github.event.inputs.version }}-macOS-${{ matrix.arch }}${{ matrix.extension }}"
          echo "filename=${FILENAME}" >> $GITHUB_OUTPUT

      - name: Rename binary
        run: |
          BUILD_TYPE="${{ github.event.inputs.release_mode == 'release' && 'release' || 'debug' }}"
          mv "target/${{ matrix.target }}/${BUILD_TYPE}/lumino-rs${{ matrix.extension }}" "${{ steps.filename.outputs.filename }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.filename.outputs.filename }}
          path: ${{ steps.filename.outputs.filename }}
          if-no-files-found: error