name: Fast Release Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'dev'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 只缓存项目 target；~/.cargo 不入包（见 .github/actions/hf-cache）。
      - name: HF cache (restore)
        uses: ./.github/actions/hf-cache
        with:
          archive: fast-release-windows-latest.tar.zst
          paths: |
            target
          hf-token: ${{ secrets.HF_TOKEN }}

      - name: Build fast-release
        run: cargo build --profile fast-release --workspace

      - name: HF cache (save)
        if: ${{ success() }}
        uses: ./.github/actions/hf-cache
        with:
          archive: fast-release-windows-latest.tar.zst
          paths: |
            target
          save: "true"
          hf-token: ${{ secrets.HF_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lumino-windows-${{ github.event.inputs.branch }}
          path: |
            target/fast-release/
            !target/fast-release/.fingerprint/
            !target/fast-release/build/
