# .github/workflows/fast-release.yml
name: Fast Release Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'dev'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build fast-release
        run: cargo build --profile fast-release --workspace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumino-windows-${{ github.event.inputs.branch }}
          path: |
            target/fast-release/
            !target/fast-release/.fingerprint/
            !target/fast-release/build/
