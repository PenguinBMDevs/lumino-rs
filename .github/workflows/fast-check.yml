name: Fast Check

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check'
        required: true
        default: 'dev'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.branch }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: HF cache (restore)
        uses: ./.github/actions/hf-cache
        with:
          archive: fast-check-${{ matrix.os }}.tar.zst
          paths: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          hf-token: ${{ secrets.HF_TOKEN }}

      - name: Cargo check
        run: cargo check --workspace

      - name: HF cache (save)
        if: always()
        uses: ./.github/actions/hf-cache
        with:
          archive: fast-check-${{ matrix.os }}.tar.zst
          paths: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          save: "true"
          hf-token: ${{ secrets.HF_TOKEN }}
