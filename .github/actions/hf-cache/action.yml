name: HF CI Cache
description: >-
  每类机器一个 zstd 压缩包，存到 Hugging Face 仓库 PenguinBMDevs/lumino-ci-cache-repo
  作为 CI 编译缓存（替代 actions/cache 的 10GB 配额）。工具链装好后调用本 action
  拉取并解压；CI 结束后再次调用（save: 'true'）重新打包并以单个 commit「删旧+传新」
  原子替换 HF 上的旧包。hf-token 为空（如 fork PR）时全程静默跳过。
inputs:
  archive:
    description: HF 仓库内的压缩包文件名，如 ci-lint-ubuntu-latest.tar.zst
    required: true
  paths:
    description: >-
      需要缓存的目录，每行一个，必须是相对仓库根目录的路径（如 target、target/release）。
      不接受 ~ / 绝对路径；不存在的目录在打包时自动跳过。
    required: true
  zstd-level:
    description: zstd 压缩级别（-T0 多线程）；默认 3（zstd 自带档，压缩最快），CI 场景 3-5 足够
    default: "3"
  save:
    description: >-
      'true' 时打包回传 HF 并替换旧包（CI 结束后第二次调用时设）。
      调用方必须用 success()（而不是 always()）：失败或取消的任务不得回写缓存。
    default: "false"
  hf-token:
    description: Hugging Face token（需对缓存仓库有写权限）
    default: ""

runs:
  using: composite
  steps:
    - name: Install zstd
      if: ${{ inputs.hf-token != '' }}
      # 缓存只是加速手段：安装失败只影响命中率，不能把 CI 门禁判红。
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v zstd >/dev/null 2>&1; then
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update && sudo apt-get install -y zstd ;;
            macOS)   brew install zstd ;;
            Windows) choco install zstd --no-progress -y ;;
          esac
        fi

    - name: Pull cache archive from Hugging Face
      # 只在「拉取模式」（save != 'true'）执行；首次运行仓库里没有包时
      # 本步以警告收尾，后续解压自然跳过（全冷编译）。
      if: ${{ inputs.hf-token != '' && inputs.save != 'true' }}
      id: pull
      continue-on-error: true
      shell: bash
      env:
        HF_TOKEN: ${{ inputs.hf-token }}
        ARCHIVE: ${{ inputs.archive }}
      run: |
        set -euo pipefail
        ACTION_DIR="$GITHUB_ACTION_PATH"
        if command -v cygpath >/dev/null 2>&1; then
          ACTION_DIR="$(cygpath -u "$ACTION_DIR")"
        fi
        source "$ACTION_DIR/paths.sh"
        CACHE_DIR="$(hf_cache_temp_dir)/hf-cache"
        mkdir -p "$CACHE_DIR"

        PY="$(hf_cache_python)"
        if [ -z "$PY" ]; then
          echo "::warning::未找到 python，跳过缓存拉取: $ARCHIVE"
          exit 0
        fi

        # 和 canary 一样：同一个 shell 里装、同一个解释器用，避免跨步骤环境漂移。
        if ! hf_cache_ensure_hf_hub "$PY"; then
          echo "::warning::huggingface_hub 安装失败，跳过缓存拉取: $ARCHIVE"
          exit 0
        fi

        if "$PY" - <<'PYEOF'
        import os
        from huggingface_hub import hf_hub_download
        p = hf_hub_download(
            repo_id="PenguinBMDevs/lumino-ci-cache-repo",
            repo_type="model",
            filename=os.environ["ARCHIVE"],
            token=os.environ.get("HF_TOKEN") or None,
            local_dir=os.path.join(os.environ["RUNNER_TEMP"], "hf-cache"),
        )
        print("pulled:", p)
        PYEOF
        then
          echo "hit=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::HF 缓存未命中（冷启动或下载失败）: $ARCHIVE"
        fi

    - name: Extract cache archive
      if: ${{ steps.pull.outputs.hit == 'true' }}
      # 缓存损坏 / 格式过期只应退化为冷编译，不能把门禁判红。
      continue-on-error: true
      shell: bash
      env:
        ARCHIVE: ${{ inputs.archive }}
        PATHS: ${{ inputs.paths }}
      run: |
        set -euo pipefail
        ACTION_DIR="$GITHUB_ACTION_PATH"
        if command -v cygpath >/dev/null 2>&1; then
          ACTION_DIR="$(cygpath -u "$ACTION_DIR")"
        fi
        source "$ACTION_DIR/paths.sh"

        cd "${GITHUB_WORKSPACE:-$PWD}"
        ROOT="$PWD"
        ARCHIVE_PATH="$(hf_cache_temp_dir)/hf-cache/$ARCHIVE"
        if [ ! -f "$ARCHIVE_PATH" ]; then
          echo "::warning::缓存包不存在，跳过解压: $ARCHIVE"
          exit 0
        fi

        parsed="$(hf_cache_roots)" || exit 0
        roots=()
        while IFS= read -r p; do
          if [ -n "$p" ]; then roots+=("$p"); fi
        done <<< "$parsed"
        if [ ${#roots[@]} -eq 0 ]; then
          echo "::warning::未配置缓存路径，跳过解压: $ARCHIVE"
          exit 0
        fi

        members="$(mktemp)"
        trap 'rm -f "$members" "$ARCHIVE_PATH"' EXIT
        zstd -dc "$ARCHIVE_PATH" | tar -tf - > "$members"

        # 只还原「配置里声明且包里确实存在」的根，避免旧包/残缺包解压报错。
        extract=()
        for p in "${roots[@]}"; do
          if hf_cache_member_exists "$p" "$members"; then
            extract+=("$p")
          else
            echo "缓存包内缺少路径，跳过: $p"
          fi
        done
        if [ ${#extract[@]} -eq 0 ]; then
          echo "::warning::缓存包不含任何配置路径，按冷启动处理: $ARCHIVE"
          exit 0
        fi

        zstd -dc "$ARCHIVE_PATH" | tar -xf - -C "$ROOT" -- "${extract[@]}"
        echo "cache extracted: $ARCHIVE (${extract[*]})"

    - name: Pack & push cache archive
      # 调用方用 success() 控制：失败或取消时本步骤不会被调度，避免半成品污染。
      # 拉取模式下不执行。打包完以单个 commit 删旧+传新：commit 失败
      # （如首次运行旧包不存在导致 delete 操作报错）时退化为纯上传，
      # 保证 HF 上旧包不会被提前删掉。continue-on-error：缓存刷新失败
      # 不拖累 CI 结论，下轮运行自动全冷编译自愈。
      if: ${{ inputs.hf-token != '' && inputs.save == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        HF_TOKEN: ${{ inputs.hf-token }}
        ARCHIVE: ${{ inputs.archive }}
        PATHS: ${{ inputs.paths }}
        LEVEL: ${{ inputs.zstd-level }}
      run: |
        set -euo pipefail
        ACTION_DIR="$GITHUB_ACTION_PATH"
        if command -v cygpath >/dev/null 2>&1; then
          ACTION_DIR="$(cygpath -u "$ACTION_DIR")"
        fi
        source "$ACTION_DIR/paths.sh"

        cd "${GITHUB_WORKSPACE:-$PWD}"
        ROOT="$PWD"
        CACHE_DIR="$(hf_cache_temp_dir)/hf-cache"
        mkdir -p "$CACHE_DIR"
        ARCHIVE_PATH="$CACHE_DIR/$ARCHIVE"
        rm -f "$ARCHIVE_PATH"

        parsed="$(hf_cache_roots)" || exit 1
        roots=()
        while IFS= read -r p; do
          if [ -n "$p" ]; then roots+=("$p"); fi
        done <<< "$parsed"

        # 只打包真实存在的目录（build 早退时 target/release 可能尚未产生）。
        packed=()
        for p in "${roots[@]}"; do
          if [ -e "$p" ]; then
            packed+=("$p")
          else
            echo "::warning::缓存路径不存在，跳过: $p"
          fi
        done
        if [ ${#packed[@]} -eq 0 ]; then
          echo "::warning::没有可打包的路径，跳过上传: $ARCHIVE"
          exit 0
        fi

        # 成员名就是仓库相对路径；解压端按同一份 paths 还原，不会错位。
        # level 默认 3：zstd 默认档，压缩最快；level 6 在 GB 级 target 上会明显拖长
        # 打包时间，CI 有被 runner 超时掐断的风险，包体积略增可由上传吸收。
        tar -cf - -C "$ROOT" -- "${packed[@]}" \
          | zstd -T0 "-$LEVEL" -o "$ARCHIVE_PATH"

        # 上传前自检：tar 在部分成员缺失时会「产包但非零退出」，
        # 管道即便有 pipefail 也要再核对成员，避免把残缺包推成新缓存。
        members="$(mktemp)"
        trap 'rm -f "$members" "$ARCHIVE_PATH"' EXIT
        zstd -dc "$ARCHIVE_PATH" | tar -tf - > "$members"
        for p in "${packed[@]}"; do
          if ! hf_cache_member_exists "$p" "$members"; then
            echo "::error::打包结果缺少成员: $p"
            exit 1
          fi
        done
        echo "archive roots: ${packed[*]}"
        ls -lh "$ARCHIVE_PATH"

        PY="$(hf_cache_python)"
        if [ -z "$PY" ]; then
          echo "::warning::未找到 python，跳过缓存上传: $ARCHIVE"
          exit 0
        fi

        # 安装与使用放在同一个 shell（canary 同款），并把失败显式判红本步骤；
        # 外层 continue-on-error 保证只影响缓存、不拖累门禁。
        if ! hf_cache_ensure_hf_hub "$PY"; then
          echo "::error::huggingface_hub 安装失败，跳过缓存上传: $ARCHIVE"
          exit 1
        fi

        "$PY" - <<'PYEOF'
        import os
        from huggingface_hub import HfApi, CommitOperationAdd, CommitOperationDelete
        api = HfApi(token=os.environ["HF_TOKEN"])
        repo_id = "PenguinBMDevs/lumino-ci-cache-repo"
        arc = os.environ["ARCHIVE"]
        path = os.path.join(os.environ["RUNNER_TEMP"], "hf-cache", arc)
        try:
            api.create_commit(
                repo_id=repo_id,
                repo_type="model",
                operations=[
                    CommitOperationDelete(path_in_repo=arc),
                    CommitOperationAdd(path_in_repo=arc, path_or_fileobj=path),
                ],
                commit_message=f"ci-cache: refresh {arc}",
            )
            print("refreshed:", arc)
        except Exception as e:
            print(f"delete+add failed ({e}); fallback to add-only")
            api.upload_file(
                path_or_fileobj=path,
                path_in_repo=arc,
                repo_id=repo_id,
                repo_type="model",
                commit_message=f"ci-cache: init {arc}",
            )
            print("uploaded:", arc)
        PYEOF
